[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-pipeline-copilot"
version = "0.1.0"
description = "Phase 1 foundation for an AI Data Pipeline Copilot portfolio project."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "SQLAlchemy==2.0.42",
    "psycopg[binary]==3.2.9",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q"
