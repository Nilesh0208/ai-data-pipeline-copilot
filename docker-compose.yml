services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-pipeline-copilot-postgres
    environment:
      POSTGRES_DB: ai_pipeline_copilot
      POSTGRES_USER: copilot_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot_user -d ai_pipeline_copilot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
